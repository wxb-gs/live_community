server:
  port: 8080
spring:
  application:
    name: gateway
  config:
    import:
      - optional:nacos:gateway.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:localhost}:18848
      config:
        server-addr: ${NACOS_HOST:localhost}:18848
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: content
          uri: lb://note-service
          predicates:
            - Path=/api/note/**,/api/interaction/**
        - id: upload
          uri: lb://upload-service
          predicates:
            - Path=/api/upload/**
        - id: search
          uri: lb://search-service
          predicates:
            - Path=/api/search/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:5173}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: [Authorization, Content-Type, X-Request-Id, X-View-Id]
            exposedHeaders: [X-Request-Id]
jwt:
  secret: ${JWT_SECRET:super-secret-key-change-in-production}
gateway:
  requests-per-second: 100
